[project]
name = "medical-helpline"
version = "0.2.0"
description = "Automated medical helpline: ingests open-access medical literature on a schedule and answers questions with verified citations."
readme = "README.md"
requires-python = ">=3.11"

# Everything here is free and runs locally: no paid API is required.
dependencies = [
    "fastapi>=0.116.0",
    "uvicorn[standard]>=0.35.0",
    "sqlalchemy>=2.0.42",
    "pydantic>=2.11.7",
    "pydantic-settings>=2.10.1",
    "python-dotenv>=1.1.1",
    "loguru>=0.7.3",
    "python-multipart>=0.0.9",
    "pymupdf>=1.24",
    "openai>=1.40",          # client library only: works with any OpenAI-compatible API (Groq, Gemini...)
    "rank-bm25>=0.2.2",
    "numpy>=1.26",
    "httpx>=0.28.1",
    "apscheduler>=3.10,<4",
    "pillow>=10",            # converts figure images (WebP, large files) before a vision model sees them
]

[project.optional-dependencies]
embeddings = ["fastembed>=0.3"]
ocr = ["pytesseract>=0.3"]
postgres = ["psycopg[binary]>=3.2"]

dev = [
    "black>=25.1.0",
    "ruff>=0.12.5",
    "pytest>=8.4.1",
    "pytest-cov>=6.2.1",
    "mypy>=1.17.1",
    "pre-commit>=4.2.0",
]

[tool.black]
line-length = 110
target-version = ["py311"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
